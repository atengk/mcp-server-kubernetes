name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定发布的 Tag (如 v0.1.0)'
        required: false

# 避免针对同一个 Tag 并发重复触发发版
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 全局默认只读权限，具体写入权限下沉至各 Job 严格限定
permissions:
  contents: read

jobs:
  # ============================================================================
  # Job 0: 统一解析并输出版本元数据 (Tag SSOT 唯一定义源)
  # ============================================================================
  resolve-version:
    name: 解析版本元数据 (Tag SSOT)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      raw: ${{ steps.version.outputs.raw }}
      build_date: ${{ steps.version.outputs.build_date }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: 提取版本号与构建时间
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          RAW_VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "raw=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          if [[ "${TAG_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Job 1: 原生二进制多架构编译、打包、校验和计算与 GitHub Release 发布
  # ============================================================================
  github-release:
    name: 构建全平台原生二进制并发布 GitHub Release
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码 (全量检出供 Git 历史与标签比对)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 交叉编译 5 大主流平台原生二进制
        run: |
          bash scripts/build-cross-platforms.sh \
            "${{ needs.resolve-version.outputs.tag }}" \
            "${{ github.sha }}" \
            "${{ needs.resolve-version.outputs.build_date }}" \
            "dist"

      - name: 打包 Release 压缩包并计算 SHA-256 校验和
        run: |
          mkdir -p release-assets
          VERSION="${{ needs.resolve-version.outputs.raw }}"

          # 打包 Unix 平台产物 (.tar.gz)
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            pkg_name="mcp-server-kubernetes_${VERSION}_${target}.tar.gz"
            tar -czf "release-assets/${pkg_name}" \
              -C "dist/mcp-server-kubernetes-${target}" mcp-server-kubernetes \
              -C "${GITHUB_WORKSPACE}" README.md LICENSE
          done

          # 打包 Windows 平台产物 (.zip)
          zip -j "release-assets/mcp-server-kubernetes_${VERSION}_win32-x64.zip" \
            "dist/mcp-server-kubernetes-win32-x64/mcp-server-kubernetes.exe" \
            README.md LICENSE

          # 自动计算全部 Release 压缩包的 SHA-256 校验清单 (避免自包含)
          cd release-assets
          sha256sum mcp-server-kubernetes_* > checksums.txt
          cat checksums.txt

      - name: 生成发布日志 (基于 Commit 与 PR)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: 创建 GitHub Release 并挂载发布产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ needs.resolve-version.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 归档构建好的二进制中间件供后续 Job 复用
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dist-binaries
          path: dist/
          retention-days: 1

  # ============================================================================
  # Job 2: 动态组装并按序发布 npm 平台子包与主包
  # ============================================================================
  publish-npm:
    name: 发布 npm 平台子包与主包
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 下载前置编译的原生二进制产物
        uses: actions/download-artifact@v4
        with:
          name: compiled-dist-binaries
          path: dist/

      - name: 动态构建 5 大平台架构子包并同步主包配置
        run: |
          node npm/scripts/build-packages.js \
            --version "${{ needs.resolve-version.outputs.raw }}" \
            --out-dir npm/packages \
            --bin-dir dist \
            --sync-main

      - name: 发布平台子包与主包至 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "[警告] 未配置 NPM_TOKEN 密钥，跳过 npm 发布流程。"
            exit 0
          fi

          # 1. 优先按序发布 5 个平台架构子包
          targets=("darwin-arm64" "darwin-x64" "linux-x64" "linux-arm64" "win32-x64")
          for target in "${targets[@]}"; do
            echo "==> 正在发布平台子包: @atengk/mcp-server-kubernetes-${target}"
            npm publish "npm/packages/${target}" --access public
          done

          # 2. 最后发布主入口包，确保客户端安装主包时可选依赖已在 npm 就绪
          echo "==> 正在发布主包: @atengk/mcp-server-kubernetes"
          npm publish npm --access public

  # ============================================================================
  # Job 3: 构建多架构 Docker 镜像并推送至 GitHub Packages (GHCR)
  # ============================================================================
  publish-docker:
    name: 构建并推送多架构 Docker 镜像 (GHCR)
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 QEMU 模拟器 (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.resolve-version.outputs.is_prerelease == 'false' }}

      - name: 构建并推送多架构镜像 (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.resolve-version.outputs.build_date }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

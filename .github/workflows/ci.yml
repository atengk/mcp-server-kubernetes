name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 并发控制：同一分支/PR 有新提交时自动取消正在执行的陈旧构建，防止竞态并节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  build-and-test:
    name: 跨技术栈构建测试与交叉编译演练
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go 代码静态合规检查 (go vet)
        run: go vet ./...

      - name: Go 单元测试与竞态检测
        run: go test -v -race ./...

      - name: Node.js 包装层单元测试与合规性检查
        run: |
          cd npm
          npm test

      - name: 5 大平台架构交叉编译演练 (Dry-Run Cross Compilation)
        run: bash scripts/build-cross-platforms.sh "ci-test" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "dist"

      - name: 平台子包生成与动态组装演练
        run: node npm/scripts/build-packages.js --version 0.0.0-ci --out-dir dist/npm-packages --bin-dir dist
